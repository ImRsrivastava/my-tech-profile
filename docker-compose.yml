version: "3.3"
services:
    app:
        build: .
        container_name: react-profile

        ports:
            - "${VITE_APP_PORT}:${VITE_APP_PORT}"
        environment:
            - VITE_APP_PORT=${VITE_APP_PORT}

        volumes:
            - .:/app
            - /app/node_modules

        stdin_open: true
        tty: true
        # environment:
        #     - CHOKIDAR_USEPOLLING=true

