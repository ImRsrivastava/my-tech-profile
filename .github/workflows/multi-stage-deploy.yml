# WORKFLOW NAME
name: Multiple Jobs Deployment Based on the Conditions

# EVENTS
on:
    push: 
        branches: 
            - develop

    # When a PR targeting staging branch gets closed
    # This will ensure it only runs when the PR was actually merged, not simply closed.
    pull_request:
        types:
            - closed
        branches:
            - staging

# GLOBAL VARIABLES
env:
    AWS_REGION: us-east-1
    AWS_ECR_REPOSITORY: my-tech-profile
    AWS_ECR_REGISTRY: 128833122451.dkr.ecr.us-east-1.amazonaws.com

# JOBS SECTION
jobs:

    # LINT JOB 
    # In GitHub Actions, 
    # Linting is used to automatically analyze your source code to catch programmatic errors, syntax bugs, and stylistic violations before they are merged. 
    # It serves as a quality gate in your CI/CD Pipeline, ensuring that all contributed code follows a consistent style and meets established best practices.
    # It is a mandatory to use in GitHub Actions CI/CD Pipeline
    # Lint
    Validate-Case:

        # RUN THIS JOB ONLY WHEN DEVELOP BRANCH PUSHED
        if: github.ref_name == 'develop'

        # OS RUNNER
        runs-on: ubuntu-latest

        timeout-minutes: 10

        strategy:
            matrix: 
                node-version: [18.x, 20.x]

        steps:
          ##################################################
          # Checkout Source
          ##################################################
          - name: Checkout Source
            uses: actions/checkout@v4


          ##################################################
          # Setup Nodejs For React JS Project
          ##################################################
          - name: Setup NodeJs
            uses: ./.github/actions/setup-nodejs
            with:
                node-version: ${{ matrix.node-version }}


          ##################################################
          # Run ES Lint to Check Code Quality
          ##################################################
          - name: Run ESlint
            run: |
                npm run lint


    # Test Application
    Test-Case:
        needs: Validate-Case

        if: success() && github.ref_name == 'develop'

        runs-on: ubuntu-latest

        environment: develop

        concurrency:
            group: develop-test
            cancel-in-progress: true

        timeout-minutes: 10

        strategy:
            matrix:
                node-version: [20.x]

        steps:
          ##################################################
          # Checkout Source
          ##################################################
          - name: Checkout Code
            uses: actions/checkout@v4


          ##################################################
          # Setup Nodejs For React JS Project
          ##################################################
          - name: Setup Node.js
            uses: ./.github/actions/setup-nodejs
            with:
                node-version: ${{ matrix.node-version }}


          ##################################################
          # Test Application Using Test Cases
          ##################################################
          - name: Test Application via Test Cases
            run: |
                npm run test


    # BUILD DOCKER IMAGE
    Build-And-Push-Image-Case:
        # RUN ONLY AFTER LINT SUCCESS
        needs: Test-Case
        if: success() && github.ref_name == 'develop'

        runs-on: ubuntu-latest
        environment: develop

        # PREVENT MULTIPLE DOCKER IMAGE PUSH SIMULTANEOUSLY
        concurrency:
            group: develop-build
            cancel-in-progress: true

        # TIMEOUT PROTECTION
        timeout-minutes: 20

        outputs:
            image_tag: ${{ steps.docker.outputs.image-tag }}

        steps:
          ##################################################
          # Checkout Source
          ##################################################
          - name: Checkout Source
            uses: actions/checkout@v4


          ##################################################
          # Manage AWS Configuration & Login
          ##################################################
          - name: Manage AWS Configuration & Login
            uses: ./.github/actions/aws-login
            with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ env.AWS_REGION }}


          ##################################################
          # Manage Docker Build, Tag and Push
          ##################################################
          - name: Manage Docker Build, Tag and Push
            id: docker
            uses: ./.github/actions/docker-build-push
            with:
                repository: ${{ env.AWS_ECR_REPOSITORY }}
                registry: ${{ env.AWS_ECR_REGISTRY }}
                image-tag: ${{ github.sha }}


    # DEPLOY DOCKER IMAGE TO ECS
    Develop-Deploy-Case:
        needs: Build-And-Push-Image-Case
        if: success() && github.ref_name == 'develop'

        runs-on: ubuntu-latest
        environment: develop

        concurrency:
            group: develop-deploy
            cancel-in-progress: true

        timeout-minutes: 20

        steps:
          ##################################################
          # Manage AWS Configuration & Login
          ##################################################
          - name: Checkout Source
            uses: actions/checkout@v4


          ##################################################
          # Manage AWS Configuration & Login
          ##################################################
          - name: Configure AWS Credentials
            uses: ./.github/actions/aws-login
            with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ env.AWS_REGION }}


          ##################################################
          # Manage Task-Definition Section
          ##################################################
          - name: Manage Task-Definition Section
            uses: ./.github/actions/aws-task-definition
            with:
                task-definition-name: My-Tech-Profile-TD-dev
                container-name: my-tech-profile
                image: ${{ env.AWS_ECR_REGISTRY }}/${{ env.AWS_ECR_REPOSITORY }}:${{ needs.Build-And-Push-Image-Case.outputs.image_tag }}
                service: My-Tech-Profile-ECS-Service-Dev
                cluster: My-Tech-Profile-ECS-Cluster-Dev



    # Staging Deployment
    Staging-Deploy-Case:
        if: github.event.pull_request.merged == true && github.base_ref == 'staging'

        runs-on: ubuntu-latest

        environment: staging

        concurrency:
            group: staging-deploy
            cancel-in-progress: true

        timeout-minutes: 20

        steps:
          ##################################################
          # Manage AWS Configuration & Login
          ##################################################
          - name: Checkout Source
            uses: actions/checkout@v4


          ##################################################
          # Manage AWS Configuration & Login
          ##################################################
          - name: Configure AWS Credentials
            uses: ./.github/actions/aws-login
            with:
                aws-access-key-id: ${{ secrets.STAGE_AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.STAGE_AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ env.AWS_REGION }}


          ##################################################
          # Manage Task-Definition Section
          ##################################################
          - name: Manage Task-Definition Section
            uses: ./.github/actions/aws-task-definition
            with:
                task-definition-name: My-Tech-Profile-TD-Stage
                container-name: my-tech-profile
                image: ${{ env.AWS_ECR_REGISTRY }}/${{ env.AWS_ECR_REPOSITORY }}:${{ github.event.pull_request.head.sha }}
                service: My-Tech-Profile-ECS-Service-Stage
                cluster: My-Tech-Profile-ECS-Cluster-Dev

